<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STL">

<title>STL للشحن السريع — لوحة الإدارة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#1d4ed8;--brand2:#0ea5e9;--accent:#f59e0b;--ok:#10b981;--bad:#ef4444;--radius:14px;--shadow:0 4px 18px rgba(15,23,42,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
#offlineBar{display:none;background:linear-gradient(90deg,#f59e0b,#fb923c);color:#fff;padding:9px 16px;text-align:center;font-size:12.5px;font-weight:800;position:sticky;top:0;z-index:30}
#offlineBar.show{display:block}
.sidebar{background:linear-gradient(180deg,#0b1b3a,#122a56);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:0 6px}
.logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#fb923c);display:grid;place-items:center;font-size:17px;font-weight:900;color:#fff;letter-spacing:.5px}
.logo h1{font-size:18px;font-weight:800;line-height:1.2}
.logo small{font-size:10.5px;color:#94a3b8;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:600;font-size:13.5px;margin-bottom:3px;cursor:pointer;transition:.18s}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.4)}
.nav a .ic{font-size:16px;width:20px;text-align:center}
.userbox{margin-top:20px;padding:12px;background:rgba(255,255,255,.06);border-radius:12px;display:flex;align-items:center;gap:10px}
.userbox .av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#fb923c);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.userbox .info{flex:1;min-width:0}
.userbox .info b{font-size:13px;display:block;line-height:1.2}
.userbox .info span{font-size:11px;color:#94a3b8}
.userbox button{background:transparent;border:0;color:#94a3b8;font-size:16px;cursor:pointer;padding:5px}
.userbox button:hover{color:#fff}
.sidefoot{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#7c8db5;line-height:1.7}
.sidefoot .st{display:flex;align-items:center;gap:6px;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.dot.off{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h2{font-size:18px;font-weight:800}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:600}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#view{padding:24px 26px 60px;max-width:1250px;width:100%}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid #eef2f7}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:16px 12px}.nav{display:flex;flex-wrap:wrap;gap:6px}.nav a{flex:1 1 auto;min-width:120px;font-size:12.5px;padding:9px 11px}.topbar{padding:12px 14px}#view{padding:16px 14px 60px}.g4{grid-template-columns:1fr}.logo{margin-bottom:16px}}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .hint{font-size:11px;font-weight:700}
.kpi .hint.up{color:var(--ok)}.kpi .hint.dn{color:var(--bad)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.3)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:#f1f5f9;color:var(--ink)}
.btn-ghost:hover{background:#e2e8f0}
.btn-ok{background:#dcfce7;color:#15803d}
.btn-ok:hover{background:#bbf7d0}
.btn-bad{background:#fee2e2;color:#b91c1c}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
label.f{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:6px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#fbfcfe;color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand2);background:#fff;box-shadow:0 0 0 3px rgba(14,165,233,.13)}
.field{margin-bottom:14px}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.row.c2,.row.c3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:11px 12px;font-size:11.5px;color:var(--muted);font-weight:800;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
.mono{font-family:ui-monospace,'Courier New',monospace;font-weight:700;font-size:12.5px;letter-spacing:.5px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.pill{background:#f1f5f9;color:#475569;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px;opacity:.6}
.timeline{position:relative;padding-right:30px;margin-top:6px}
.timeline::before{content:'';position:absolute;right:11px;top:8px;bottom:8px;width:3px;background:#e2e8f0;border-radius:3px}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;right:-30px;top:1px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#e2e8f0;color:#94a3b8;border:3px solid #fff;box-shadow:0 0 0 2px #e2e8f0}
.tl-item.done .tl-dot{background:var(--ok);color:#fff;box-shadow:0 0 0 2px var(--ok)}
.tl-item.current .tl-dot{background:var(--accent);color:#fff;box-shadow:0 0 0 2px var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--accent)}50%{box-shadow:0 0 0 7px rgba(245,158,11,.22)}}
.tl-item .t{font-weight:800;font-size:13.5px}
.tl-item .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.tl-item.pending .t{color:#94a3b8;font-weight:600}
.bar{height:9px;border-radius:6px;background:#f1f5f9;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .5s}
.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12.5px;font-weight:700}
.quote{background:linear-gradient(135deg,#0b1b3a,#16336b);color:#fff;border-radius:14px;padding:20px}
.quote .total{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.quote .total small{font-size:14px;font-weight:700;opacity:.7}
.quote .brk{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.13)}
.quote .brk:last-child{border:0}
.quote .brk span:last-child{font-weight:800}
.node{background:#fff;border-radius:13px;padding:16px;border:1px solid #eef2f7;box-shadow:var(--shadow);display:flex;gap:13px;align-items:flex-start}
.node .ico{width:42px;height:42px;border-radius:11px;background:#eff6ff;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.node h4{font-size:14px;font-weight:800;margin-bottom:2px}
.node p{font-size:11.5px;color:var(--muted);line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:100;padding:20px;backdrop-filter:blur(3px);overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px;box-shadow:0 25px 60px rgba(0,0,0,.3);animation:pop .2s;margin:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.label{text-align:center}
.label .brandline{font-weight:800;font-size:18px;color:var(--brand);letter-spacing:1px}
.label .code{font-family:ui-monospace,monospace;font-weight:800;font-size:19px;letter-spacing:2px;margin:6px 0 12px}
.barcode{display:flex;justify-content:center;align-items:flex-end;height:56px;margin:14px 0;gap:1px}
.barcode i{display:block;height:48px;background:#0f172a}
.label .meta{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px dashed #e2e8f0;text-align:right}
.label .meta b{font-weight:800}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:13px 24px;border-radius:11px;font-weight:700;font-size:13px;z-index:200;transition:.35s;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.section-title{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.divider{height:1px;background:var(--line);margin:20px 0}
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 15px;border-radius:10px;font-size:12px;font-weight:600;line-height:1.7;margin-bottom:18px}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0b1b3a,#16336b);display:grid;place-items:center;z-index:300;padding:20px}
.login-card{background:#fff;border-radius:18px;padding:32px;max-width:400px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.4);text-align:center}
.login-card .lg-mark{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#fb923c);display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;margin:0 auto 14px;letter-spacing:1px}
.login-card h1{font-size:20px;font-weight:800;margin-bottom:4px}
.login-card p{font-size:12px;color:var(--muted);margin-bottom:22px;font-weight:600}
.login-card input{margin-bottom:12px;text-align:right}
.login-card button{width:100%;padding:13px;margin-top:4px;justify-content:center}
.login-error{background:#fee2e2;color:#b91c1c;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:700;margin-bottom:12px;display:none}
.login-error.show{display:block}
.login-hint{font-size:11px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid var(--line);line-height:1.9;text-align:right}
.login-hint b{color:var(--brand);font-family:ui-monospace,monospace}
#stlMap{height:520px;border-radius:12px;z-index:1;border:1px solid var(--line)}
@media(max-width:820px){#stlMap{height:420px}}
.leaflet-popup-content{font-family:'Cairo',sans-serif;direction:rtl;text-align:right;font-size:12.5px;line-height:1.6;margin:12px 16px}
.leaflet-popup-content b{color:var(--brand);font-size:13.5px;display:block;margin-bottom:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.courier-chip{display:inline-flex;align-items:center;gap:5px;background:#eff6ff;color:#1d4ed8;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800}
@media print{body *{visibility:hidden}.modal,.modal *{visibility:visible}.overlay{position:absolute;background:#fff}.modal{box-shadow:none;max-width:100%}.modal .btn{display:none}}
</style>
</head>
<body>

<div id="offlineBar">⚠️ أنت غير متصل — التطبيق يعمل من الذاكرة المؤقتة</div>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="lg-mark">STL</div>
    <h1>STL للشحن السريع</h1>
    <p>لوحة الإدارة — يرجى تسجيل الدخول</p>
    <div id="loginError" class="login-error"></div>
    <input id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
    <input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" onclick="doLogin()">🔐 دخول</button>
    <div class="login-hint">
      حسابات تجريبية:<br>
      مدير: <b>admin</b> / <b>1234</b><br>
      مشرف: <b>manager</b> / <b>1234</b><br>
      مندوب: <b>courier1</b> / <b>1234</b> (يُوجَّه لتطبيق المندوب)
    </div>
  </div>
</div>

<div class="app hide" id="appRoot">
  <aside class="sidebar">
    <div class="logo">
      <div class="mark">STL</div>
      <div><h1>STL للشحن</h1><small id="pwaMode">لوحة الإدارة</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox">
      <div class="av">👤</div>
      <div class="info"><b id="userName">—</b><span id="userRole">—</span></div>
      <button onclick="logout()" title="تسجيل الخروج">🚪</button>
    </div>
    <div class="sidefoot">
      <div class="st"><span class="dot" id="onlineDot"></span><span id="onlineLabel">متصل</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div><h2 id="pageTitle">لوحة التحكم</h2><div class="sub" id="pageSub">—</div></div>
      <div class="topbar-actions">
        <button id="installBtn" class="btn btn-primary btn-sm" onclick="installApp()" style="display:none">📥 تثبيت</button>
        <button class="btn btn-primary btn-sm" onclick="nav('create')">＋ شحنة جديدة</button>
      </div>
    </header>
    <div id="view"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
const USERS = [
  {u:'admin',    p:'1234', name:'مدير النظام',   role:'admin'},
  {u:'manager',  p:'1234', name:'مشرف عمليات',   role:'manager'},
  {u:'courier1', p:'1234', name:'محمد السائق',   role:'courier'},
  {u:'courier2', p:'1234', name:'أحمد المندوب',  role:'courier'},
];
const SESSION_KEY = 'stl_session';
function getSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY));}catch(e){return null;} }
function setSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const found = USERS.find(x => x.u === u && x.p === p);
  const err = document.getElementById('loginError');
  if(!found){
    err.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة';
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');
  setSession({username:found.u, name:found.name, role:found.role, at:Date.now()});
  if(found.role === 'courier'){
    location.href = 'courier.html';
    return;
  }
  bootAfterLogin();
}
function logout(){
  if(!confirm('تسجيل الخروج؟')) return;
  clearSession(); location.reload();
}
function bootAfterLogin(){
  const s = getSession();
  if(!s){ document.getElementById('loginScreen').classList.remove('hide'); return; }
  if(s.role === 'courier'){ location.href='courier.html'; return; }
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('appRoot').classList.remove('hide');
  document.getElementById('userName').textContent = s.name;
  document.getElementById('userRole').textContent = s.role === 'admin' ? 'مدير النظام' : 'مشرف عمليات';
  buildNav();
  const urlPage = new URLSearchParams(location.search).get('page');
  nav(PAGES.find(p=>p.id===urlPage) && canSee(urlPage) ? urlPage : 'dashboard');
  updateOnline();
}
function canSee(id){
  const s = getSession();
  if(!s) return false;
  if(s.role === 'admin') return true;
  if(s.role === 'manager') return id !== 'reports';
  return false;
}

const LS_KEY = 'stl_demo_v1';
const ID_PREFIX = 'STL-';
const CITIES = [
  {name:'دمشق',lat:33.51,lng:36.29},{name:'ريف دمشق',lat:33.55,lng:36.40},
  {name:'حلب',lat:36.20,lng:37.13},{name:'حمص',lat:34.73,lng:36.72},
  {name:'حماة',lat:35.13,lng:36.75},{name:'اللاذقية',lat:35.52,lng:35.79},
  {name:'طرطوس',lat:34.89,lng:35.89},{name:'درعا',lat:32.62,lng:36.10},
  {name:'السويداء',lat:32.71,lng:36.57},{name:'إدلب',lat:35.93,lng:36.63},
  {name:'الرقة',lat:35.95,lng:39.01},{name:'دير الزور',lat:35.33,lng:40.14},
  {name:'الحسكة',lat:36.50,lng:40.75},{name:'القامشلي',lat:37.05,lng:41.23},
];
const STATUSES = [
  {key:'created',label:'تم إنشاء الشحنة',icon:'📝',color:'#64748b'},
  {key:'picked',label:'تم الاستلام من المرسل',icon:'📦',color:'#0ea5e9'},
  {key:'in_transit',label:'قيد النقل',icon:'🚚',color:'#f59e0b'},

  {key:'delivered',label:'تم التسليم',icon:'✅',color:'#10b981'},
];
const NODES = [
  {city:'دمشق',area:'المزة – شارع الجلاء',type:'فرز رئيسي',icon:'🏢',phone:'011-2345678',lat:33.5040,lng:36.2610},
  {city:'دمشق',area:'جرمانا – الساحة الرئيسية',type:'نقطة استلام',icon:'📍',phone:'011-3344556',lat:33.4830,lng:36.3520},
  {city:'حلب',area:'الميدان – شارع الجلاء',type:'فرز رئيسي',icon:'🏢',phone:'021-2233445',lat:36.2040,lng:37.1340},
  {city:'حلب',area:'الشيخ نجار – المنطقة الصناعية',type:'فرز B2B',icon:'🏭',phone:'021-3344556',lat:36.2740,lng:37.2640},
  {city:'حمص',area:'سوق الحسبة – وسط المدينة',type:'نقطة استلام',icon:'📍',phone:'031-4455667',lat:34.7320,lng:36.7160},
