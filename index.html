<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL</title>
<style>
body{font-family:sans-serif;background:#0b1b3a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;flex-direction:column}
input,button{padding:15px;margin:10px;width:250px;border-radius:8px;border:none;font-size:16px}
button{background:#f59e0b;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h2>لوحة إدارة STL</h2>
<input id="user" placeholder="اسم المستخدم">
<input id="pass" placeholder="كلمة المرور" type="password">
<button onclick="login()">دخول</button>

<script>
function login(){
  var u = document.getElementById('user').value;
  var p = document.getElementById('pass').value;
  if(u === 'admin' && p === '1234'){
    alert('تم تسجيل الدخول بنجاح! الأزرار تعمل.');
  } else {
    alert('اسم المستخدم أو كلمة المرور خاطئة!');
  }
}
</script>
</body>
</html>
