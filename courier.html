<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STL مندوب">
<title>STL — تطبيق المندوب</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#1d4ed8;--brand2:#0ea5e9;--accent:#f59e0b;--ok:#10b981;--bad:#ef4444;--radius:14px;--shadow:0 4px 18px rgba(15,23,42,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}
#offlineBar{display:none;background:linear-gradient(90deg,#f59e0b,#fb923c);color:#fff;padding:9px 16px;text-align:center;font-size:12.5px;font-weight:800;position:sticky;top:0;z-index:30}
#offlineBar.show{display:block}
.header{background:linear-gradient(135deg,#0b1b3a,#16336b);color:#fff;padding:20px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.header .brand{display:flex;align-items:center;gap:10px}
.header .brand .mk{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f59e0b,#fb923c);display:grid;place-items:center;font-weight:900;font-size:15px}
.header .brand h1{font-size:16px;font-weight:800}
.header .brand small{font-size:10.5px;opacity:.7}
.header button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:9px 14px;border-radius:9px;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer}
main{padding:18px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid #eef2f7;margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.3)}
.btn-ok{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn-bad{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn-ghost{background:#f1f5f9;color:var(--ink)}
.btn-block{width:100%}
.btn-lg{padding:16px;font-size:15px}
label.f{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;background:#fbfcfe;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand2);background:#fff;box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.field{margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.mono{font-family:ui-monospace,'Courier New',monospace;font-weight:700;font-size:12.5px;letter-spacing:.5px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);border:1px solid #eef2f7}
.kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.kpi .val{font-size:24px;font-weight:800}
.ship-card{background:#fff;border-radius:12px;padding:14px;border:1px solid #eef2f7;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.ship-card .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ship-card .route{font-weight:800;font-size:14px}
.ship-card .courier-chip{font-size:10.5px;background:#eff6ff;color:#1d4ed8;padding:2px 8px;border-radius:6px;font-weight:800;display:inline-block}
.scan-area{background:#0b1b3a;border-radius:14px;padding:20px;text-align:center;color:#fff}
.scan-video{width:100%;border-radius:10px;background:#000;display:none}
.scan-video.active{display:block;margin-bottom:12px}
.scan-btn{width:100%;padding:18px;font-size:16px;margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.75);display:grid;place-items:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px;box-shadow:0 25px 60px rgba(0,0,0,.3);animation:pop .2s;max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:13px 24px;border-radius:11px;font-weight:700;font-size:13px;z-index:200;transition:.35s;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0b1b3a,#16336b);display:grid;place-items:center;z-index:300;padding:20px}
.login-card{background:#fff;border-radius:18px;padding:30px;max-width:380px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.4);text-align:center}
.login-card .lg-mark{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#fb923c);display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;margin:0 auto 14px;letter-spacing:1px}
.login-card h1{font-size:19px;font-weight:800;margin-bottom:4px}
.login-card p{font-size:12px;color:var(--muted);margin-bottom:22px;font-weight:600}
.login-card input{margin-bottom:12px;text-align:right}
.login-error{background:#fee2e2;color:#b91c1c;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:700;margin-bottom:12px;display:none}
.login-error.show{display:block}
.login-hint{font-size:11px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--line);line-height:1.9}
.login-hint b{color:var(--brand);font-family:ui-monospace,monospace}
.section-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.6}
.sig-canvas{width:100%;height:120px;border:2px dashed var(--line);border-radius:10px;background:#fafbfc;display:block;margin-top:8px;touch-action:none}
</style>
</head>
<body>

<div id="offlineBar">⚠️ غير متصل — سيتم حفظ الحالة محلياً</div>

<div id="loginScreen" class="login-screen hide">
  <div class="login-card">
    <div class="lg-mark">STL</div>
    <h1>تطبيق المندوب</h1>
    <p>سجّل دخولك لبدء العمل</p>
    <div id="loginError" class="login-error"></div>
    <input id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
    <input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary btn-block" onclick="doLogin()">🔐 دخول</button>
    <div class="login-hint">حسابات تجريبية:<br>مندوب 1: <b>courier1</b> / <b>1234</b><br>مندوب 2: <b>courier2</b> / <b>1234</b></div>
  </div>
</div>

<div id="appRoot" class="hide">
  <header class="header">
    <div class="brand">
      <div class="mk">STL</div>
      <div><h1>تطبيق المندوب</h1><small id="userLabel">—</small></div>
    </div>
    <div style="display:flex;gap:6px">
      <button onclick="showScanModal()" title="مسح باركود">📷</button>
      <button onclick="logout()" title="خروج">🚪</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
const USERS = [
  {u:'admin',p:'1234',name:'مدير النظام',role:'admin'},
  {u:'manager',p:'1234',name:'مشرف عمليات',role:'manager'},
  {u:'courier1',p:'1234',name:'محمد السائق',role:'courier'},
  {u:'courier2',p:'1234',name:'أحمد المندوب',role:'courier'},
];
const SESSION_KEY = 'stl_session';
function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY));}catch(e){return null;}}
function setSession(s){localStorage.setItem(SESSION_KEY, JSON.stringify(s));}
function clearSession(){localStorage.removeItem(SESSION_KEY);}
function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const f = USERS.find(x=>x.u===u && x.p===p);
  const err = document.getElementById('loginError');
  if(!f){err.textContent='❌ بيانات خاطئة';err.classList.add('show');return;}
  if(f.role !== 'courier'){err.textContent='⚠️ هذا التطبيق للمناديب فقط';err.classList.add('show');return;}
  err.classList.remove('show');
  setSession({username:f.u, name:f.name, role:f.role, at:Date.now()});
  boot();
}
function logout(){
  if(!confirm('تسجيل الخروج؟')) return;
  clearSession(); location.reload();
}

const LS_KEY = 'stl_demo_v1';
const ID_PREFIX = 'STL-';
const STATUSES = [
  {key:'created',label:'تم إنشاء الشحنة',icon:'📝',color:'#64748b'},
  {key:'picked',label:'تم الاستلام',icon:'📦',color:'#0ea5e9'},
  {key:'in_transit',label:'قيد النقل',icon:'🚚',color:'#f59e0b'},
  {key:'sorting',label:'في الفرز',icon:'🏢',color:'#8b5cf6'},
  {key:'out_delivery',label:'قيد التوصيل',icon:'🛵',color:'#ec4899'},
  {key:'delivered',label:'تم التسليم',icon:'✅',color:'#10b981'},
];
function loadState(){try{const r = localStorage.getItem(LS_KEY); if(r) return JSON.parse(r);}catch(e){} return {shipments:[],counter:0};}
function saveState(){localStorage.setItem(LS_KEY, JSON.stringify(state));}
let state = loadState();

function shortMoney(n){return (Number(n)||0).toLocaleString('en-US');}
function money(n){return shortMoney(n)+' ل.س';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(ts){const d=new Date(ts),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2600);}

function render(){
  const s = getSession();
  document.getElementById('userLabel').textContent = s.name + ' · ' + s.username;
  const mine = state.shipments.filter(x=>x.courier === s.username);
  const active = mine.filter(x=>x.statusIdx>=1 && x.statusIdx<5);
  const delivered = mine.filter(x=>x.statusIdx===5);
  const totalCOD = mine.filter(x=>x.statusIdx===5).reduce((a,x)=>a+(x.cod||0),0);

  document.getElementById('main').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="lbl">مهامي النشطة</div><div class="val" style="color:var(--accent)">${active.length}</div></div>
      <div class="kpi"><div class="lbl">تم التسليم</div><div class="val" style="color:var(--ok)">${delivered.length}</div></div>
      <div class="kpi"><div class="lbl">إجمالي شحناتي</div><div class="val">${mine.length}</div></div>
      <div class="kpi"><div class="lbl">COD محصّل</div><div class="val" style="font-size:16px">${shortMoney(totalCOD)}</div></div>
    </div>

    <div class="scan-area" style="margin-bottom:16px">
      <div style="font-size:42px;margin-bottom:8px">📷</div>
      <div style="font-size:14px;font-weight:800;margin-bottom:4px">امسح باركود الشحنة</div>
      <div style="font-size:11.5px;opacity:.7;margin-bottom:6px">الكاميرا الخلفية — يعمل على Chrome Android</div>
      <button class="btn btn-primary btn-block scan-btn" onclick="showScanModal()">📷 بدء المسح</button>
    </div>

    <div class="section-title">🛵 شحناتي النشطة (${active.length})</div>
    ${active.length ? active.map(x=>shipCard(x)).join('') : `<div class="card empty"><div class="big">✨</div>لا توجد مهام نشطة حالياً</div>`}

    <div class="section-title" style="margin-top:24px">✅ آخر ما سلّمت (${Math.min(delivered.length,5)})</div>
    ${delivered.length ? delivered.slice(-5).reverse().map(x=>shipCard(x, true)).join('') : `<div class="card empty">لا توجد تسليمات بعد</div>`}

    <div class="card" style="margin-top:20px;background:#f8fafc">
      <div class="section-title">🔧 أدوات</div>
      <button class="btn btn-ghost btn-block" onclick="showManualModal()" style="margin-bottom:8px">⌨️ إدخال رقم الشحنة يدوياً</button>
      <button class="btn btn-ghost btn-block" onclick="showMyAll()">📋 عرض كل شحناتي</button>
    </div>
  `;
}

function shipCard(x, done){
  const st = STATUSES[x.statusIdx];
  return `<div class="ship-card">
    <div class="row">
      <div class="mono">${x.id}</div>
      <span class="badge" style="background:${st.color}18;color:${st.color}">${st.icon} ${st.label}</span>
    </div>
    <div class="route">${esc(x.from)} ← ${esc(x.to)}</div>
    <div style="font-size:12.5px;color:var(--muted)">${esc(x.receiver)} · ${esc(x.receiverPhone)}</div>
    ${x.address?`<div style="font-size:11.5px;color:var(--muted)">📍 ${esc(x.address)}</div>`:''}
    <div class="row" style="font-size:12.5px;font-weight:700">
      <span>${x.chargeable} كغ${x.express?' ⚡':''}</span>
      <span>${money(x.total)}</span>
    </div>
    ${x.cod?`<div style="background:#fef3c7;color:#92400e;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:800">💰 COD: ${money(x.cod)}</div>`:''}
    ${!done?`<div style="display:flex;gap:8px;margin-top:6px">
      ${x.statusIdx<4?`<button class="btn btn-primary" style="flex:1" onclick="advance('${x.id}')">تقديم</button>`:''}
      <button class="btn btn-ok" style="flex:1" onclick="deliver('${x.id}')">✅ تم التسليم</button>
    </div>`:''}
  </div>`;
}

function advance(id){
  const x = state.shipments.find(s=>s.id===id);
  if(!x || x.statusIdx >= 5) return;
  x.statusIdx++;
  x.history.push({idx:x.statusIdx, at:Date.now()});
  saveState(); toast('→ '+STATUSES[x.statusIdx].label); render();
}
function deliver(id){
  const x = state.shipments.find(s=>s.id===id);
  if(!x) return;
  x.statusIdx = 5;
  x.history.push({idx:5, at:Date.now()});
  saveState(); toast('✅ تم التسليم'); render();
}

let scanStream = null, scanAnim = null;
function showScanModal(){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeScan()"><div class="modal">
    <div class="section-title">📷 مسح باركود الشحنة</div>
    <video id="scanVideo" class="scan-video" playsinline muted></video>
    <div id="scanStatus" style="text-align:center;font-size:12.5px;color:var(--muted);padding:8px 0">جاري فتح الكاميرا...</div>
    <button class="btn btn-primary btn-block" onclick="startScan()" id="startScanBtn">▶️ تشغيل الكاميرا</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="showManualModal()">⌨️ إدخال يدوي</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeScan()">إلغاء</button>
  </div></div>`;
}
async function startScan(){
  const video = document.getElementById('scanVideo');
  const status = document.getElementById('scanStatus');
  const btn = document.getElementById('startScanBtn');
  if(!('BarcodeDetector' in window)){
    status.innerHTML = '⚠️ المتصفح لا يدعم المسح التلقائي — استخدم الإدخال اليدوي';
    status.style.color = 'var(--bad)';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.innerHTML = '⚠️ الكاميرا غير متاحة — استخدم الإدخال اليدوي';
    status.style.color = 'var(--bad)';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: {ideal: 1280}, height: {ideal: 720} }
    });
    video.srcObject = scanStream;
    video.classList.add('active');
    await video.play();
    btn.style.display = 'none';
    status.textContent = '🎯 وجّه الكاميرا نحو الباركود...';
    scanLoop(video, status);
  }catch(err){
    status.innerHTML = '⚠️ تعذر فتح الكاميرا: ' + (err.message||'') + ' — استخدم الإدخال اليدوي';
    status.style.color = 'var(--bad)';
  }
}
async function scanLoop(video, status){
  const detector = new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','qr_code','code_93','upc_a','upc_e','itf','codabar']});
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const loop = async () => {
    if(!scanStream){ return; }
    if(video.readyState !== 4){ scanAnim = requestAnimationFrame(loop); return; }
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    try{
      const codes = await detector.detect(canvas);
      if(codes && codes.length){
        const raw = codes[0].rawValue.trim().toUpperCase();
        closeScan();
        handleCode(raw);
        return;
      }
    }catch(e){}
    scanAnim = requestAnimationFrame(loop);
  };
  loop();
}
function closeScan(){
  if(scanAnim) cancelAnimationFrame(scanAnim);
  scanAnim = null;
  if(scanStream){
    scanStream.getTracks().forEach(t=>t.stop());
    scanStream = null;
  }
  document.getElementById('modalRoot').innerHTML = '';
}
function showManualModal(){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeManual()"><div class="modal">
    <div class="section-title">⌨️ إدخال رقم الشحنة</div>
    <div class="field"><label class="f">رقم الشحنة (STL-XXXX)</label><input id="manualCode" placeholder="STL-4821" style="font-family:ui-monospace,monospace;letter-spacing:1px" onkeydown="if(event.key==='Enter')submitManual()"></div>
    <button class="btn btn-primary btn-block" onclick="submitManual()">بحث</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeManual()">إلغاء</button>
  </div></div>`;
  setTimeout(()=>document.getElementById('manualCode')?.focus(), 100);
}
function closeManual(){ document.getElementById('modalRoot').innerHTML = ''; }
function submitManual(){
  const code = document.getElementById('manualCode').value.trim().toUpperCase();
  closeManual();
  if(code) handleCode(code);
}

function handleCode(code){
  const sh = state.shipments.find(s=>s.id.toUpperCase() === code);
  if(!sh){
    toast('❌ لم يُعثر على الشحنة: ' + code);
    return;
  }
  const session = getSession();
  const st = STATUSES[sh.statusIdx];
  const notMine = sh.courier && sh.courier !== session.username;
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeAction()"><div class="modal">
    <div class="section-title">📦 ${sh.id}</div>
    <div style="font-size:13px;line-height:1.8;margin-bottom:16px">
      <div><b>المسار:</b> ${esc(sh.from)} ← ${esc(sh.to)}</div>
      <div><b>المستلم:</b> ${esc(sh.receiver)} · ${esc(sh.receiverPhone)}</div>
      ${sh.address?`<div><b>العنوان:</b> ${esc(sh.address)}</div>`:''}
      <div><b>الوزن:</b> ${sh.chargeable} كغ ${sh.express?'⚡':''}</div>
      <div><b>الأجرة:</b> ${money(sh.total)}</div>
      ${sh.cod?`<div style="color:#92400e;font-weight:800"><b>COD:</b> ${money(sh.cod)}</div>`:''}
      <div style="margin-top:8px"><span class="badge" style="background:${st.color}18;color:${st.color}">${st.icon} ${st.label}</span></div>
      ${notMine?`<div style="color:var(--bad);font-size:11.5px;margin-top:8px">⚠️ هذه الشحنة مسندة لمندوب آخر: ${sh.courier}</div>`:''}
    </div>
    ${sh.statusIdx===5?`<div style="background:#dcfce7;color:#15803d;padding:12px;border-radius:9px;text-align:center;font-weight:800">✅ هذه الشحنة مُسلّمة مسبقاً</div>`:`
    <button class="btn btn-ok btn-block btn-lg" onclick="deliverAndClose('${sh.id}')">✅ تأكيد التسليم</button>
    ${sh.
